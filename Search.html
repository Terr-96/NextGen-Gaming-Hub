<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Games | NextGen Gaming Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }
        
        .search-header {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1000');
            background-size: cover;
            color: white;
            padding: 80px 0;
            margin-bottom: 40px;
            clip-path: polygon(0 0, 100% 0, 100% 90%, 0% 100%);
        }

        .search-bar {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 10px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .search-input {
            border: none;
            padding: 10px 25px;
            width: 75%;
            border-radius: 50px;
            outline: none;
        }

        /* 与首页一致的卡片悬停动画 */
        .game-card {
            border: none;
            border-radius: 20px;
            transition: all 0.3s ease-in-out;
            overflow: hidden;
            height: 100%;
        }

        .game-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2) !important;
        }

        .game-img {
            height: 200px;
            object-fit: cover;
        }

        .badge-rating {
            background-color: #ffc107;
            color: #000;
            font-weight: bold;
        }

        .btn-round { border-radius: 50px; font-weight: 600; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">NextGen Gaming</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link active" href="Search.html">Search</a>
                <a class="nav-link" href="about.html">About</a>
                <a class="nav-link" href="features.html">Features</a>
                <a class="nav-link" href="contact.html">Contact</a>
                <a class="nav-link" href="promotion.html">Promotions</a>
                <a class="nav-link active" href="wishlist.html">Wishlist</a>
                <a class="nav-link" href="gallery.html">Gallery</a>
                <a class="nav-link" href="cart.html">

                <i class="bi bi-cart3" style="font-size: 1.2rem;"></i></a>
            </div>
        </div>
    </div>
</nav>

<header class="search-header text-center">
    <div class="container">
        <h1 class="display-4 fw-bold mb-3">Discover Your Next Adventure</h1>
        <div class="search-bar d-flex justify-content-between">
            <input type="text" id="gameInput" class="search-input" placeholder="Search for a game...">
            <button class="btn btn-dark btn-round px-4" id="searchBtn">SEARCH</button>
        </div>
    </div>
</header>

<div class="container mb-5">
    <div id="loading" class="text-center d-none my-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Fetching real-time data...</p>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4" id="gameResults">
        </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function() {


        $('#searchBtn').click(function() {
            let query = $('#gameInput').val();
            if(!query) return;
            searchGames(query);
        });

        $('#gameInput').keypress(function(e) {
            if(e.which == 13) $('#searchBtn').click();
        });

        function searchGames(query) {
            $('#loading').removeClass('d-none');
            $('#gameResults').empty();

            $.ajax({
                url: `https://api.rawg.io/api/games?key=b97c1fb8a7aa4303ab6b429a67795b47&search=${encodeURIComponent(query)}`,
                method: 'GET',
                success: function(data) {
                    $('#loading').addClass('d-none');
                    let games = data.results;
                    if(games.length === 0) {
                        $('#gameResults').html('<div class="col-12 text-center"><h3>No games found.</h3></div>');
                        return;
                    }
                    games.forEach(game => {
                        let gameHtml = `
                            <div class="col">
                                <div class="card game-card shadow-sm">
                                    <img src="${game.background_image || 'https://via.placeholder.com/400x200'}" class="card-img-top game-img">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <span class="badge badge-rating">⭐ ${game.rating || 'N/A'}</span>
                                            <small class="text-muted">${game.released || 'TBA'}</small>
                                        </div>
                                        <h5 class="card-title fw-bold">${game.name}</h5>
                                        <p class="card-text small text-secondary">${game.platforms ? game.platforms.map(p => p.platform.name).slice(0,2).join(', ') : 'Multiple Platforms'}</p>
                                        <button class="btn btn-sm btn-outline-dark w-100 btn-round" onclick="saveGame('${game.name}')">Collect</button>
                                    </div>
                                </div>
                            </div>
                        `;
                        $('#gameResults').append(gameHtml);
                    });
                }
            });
        }
    });

    function saveGame(name) {
        sessionStorage.setItem('lastViewedGame', name);
        alert(name + " saved to session collection!");
    }
</script>

</body>
</html>
