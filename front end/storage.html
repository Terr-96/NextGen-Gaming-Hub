<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist | UTAR Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .wishlist-item { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">NextGen Gaming</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="search.html">Find Games</a>
            <a class="nav-link active" href="wishlist.html">Wishlist</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">My Saved Consoles</h1>
    <p class="text-muted">These items are saved in your browser's <strong>Local Storage</strong>.</p>
    
    <div id="wishlist-container">
        </div>

    <button class="btn btn-danger mt-4" onclick="clearWishlist()">Clear All Items</button>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        displayWishlist();
    });

    function displayWishlist() {
        // RETRIEVE FROM LOCAL STORAGE
        let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
        let container = $('#wishlist-container');
        container.empty();

        if (wishlist.length === 0) {
            container.html('<div class="alert alert-info">Your wishlist is currently empty!</div>');
        } else {
            wishlist.forEach((item, index) => {
                container.append(`
                    <div class="wishlist-item animated fadeIn">
                        <span><strong>${item}</strong></span>
                        <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${index})">Remove</button>
                    </div>
                `);
            });
        }
    }

    function removeItem(index) {
        let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
        wishlist.splice(index, 1); // Remove item from array
        localStorage.setItem('wishlist', JSON.stringify(wishlist));
        displayWishlist(); // Refresh the list
    }

    function clearWishlist() {
        if(confirm("Are you sure you want to clear your wishlist?")) {
            localStorage.removeItem('wishlist');
            displayWishlist();
        }
    }
</script>
</body>
</html>
