<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Game Search | NextGen Hub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
--xbox-green:#107c10;
}

body{
background-color:#f4f7f6;
font-family:'Segoe UI',sans-serif;
}

.search-header{
background:linear-gradient(135deg,#212529,#343a40);
color:white;
padding:80px 0 60px;
margin-bottom:30px;
border-bottom:5px solid var(--xbox-green);
}

.game-card{
border:none;
border-radius:15px;
transition:all 0.3s ease;
overflow:hidden;
background:#fff;
cursor:pointer;
}

.game-card:hover{
transform:translateY(-10px);
box-shadow:0 15px 30px rgba(0,0,0,0.15);
}

.game-img{
height:180px;
object-fit:cover;
}

#loading{
display:none;
}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
<div class="container">

<span class="navbar-brand fw-bold">NextGen Gaming</span>

<div class="d-flex flex-wrap gap-2">
<a href="index.html" class="btn btn-light btn-sm">Home</a>
<a href="search.html" class="btn btn-light btn-sm">Search</a>
<a href="about.html" class="btn btn-light btn-sm">About</a>
<a href="features.html" class="btn btn-light btn-sm">Features</a>
<a href="contact.html" class="btn btn-light btn-sm">Contact</a>
<a href="promotions.html" class="btn btn-light btn-sm">Promotions</a>
<a href="storage.html" class="btn btn-light btn-sm">Wishlist</a>
<a href="gallery.html" class="btn btn-light btn-sm">Gallery</a>
</div>

</div>
</nav>

<!-- Header -->
<header class="search-header text-center">
<div class="container">

<h1 class="display-4 fw-bold">Global Games Database</h1>
<p class="lead">Search games using RESTful API (RAWG)</p>

<div class="row justify-content-center mt-4">
<div class="col-md-8 col-lg-6">

<div class="input-group input-group-lg shadow">
<input type="text" id="gameQuery" class="form-control border-0" placeholder="Enter game (Halo, GTA, Zelda...)">
<button class="btn btn-primary px-4 fw-bold" id="searchBtn">SEARCH</button>
</div>

</div>
</div>

</div>
</header>

<!-- Main -->
<main class="container my-5">

<div id="loading" class="text-center my-5">
<div class="spinner-border text-primary"></div>
<p class="mt-2 text-muted">Fetching data...</p>
</div>

<div id="apiResults" class="row">
<div class="col-12 text-center text-muted">
<p>Ready to search? Enter a game title.</p>
</div>
</div>

</main>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function(){

$("#searchBtn").click(function(){

const query=$("#gameQuery").val().trim()

if(!query){
alert("Please enter a game title!")
return
}

$("#loading").show()
$("#apiResults").hide().html("")

$.ajax({

url:`https://api.rawg.io/api/games?key=b97c1fb8a7aa4303ab6b429a67795b47&search=${encodeURIComponent(query)}&page_size=6`,

method:"GET",
dataType:"json",

success:function(data){

$("#loading").hide()

let html=""

if(data.results && data.results.length>0){

data.results.forEach(function(game){

const img=game.background_image
?game.background_image
:"https://via.placeholder.com/400x250?text=No+Image"

html+=`

<div class="col-md-4 mb-4">

<div class="card game-card h-100 shadow-sm"
onclick="window.open('https://rawg.io/games/${game.slug}','_blank')">

<img src="${img}" class="card-img-top game-img">

<div class="card-body text-center">

<h5 class="fw-bold mb-2">${game.name}</h5>

<p class="text-muted small">Released: ${game.released || "N/A"}</p>

<p class="text-muted small">Rating: ${game.rating || "N/A"}</p>

</div>

</div>

</div>
`
})

}else{

html=`<div class="col-12 text-center alert alert-warning">
No games found. Try "Halo" or "Mario".
</div>`

}

$("#apiResults").html(html).fadeIn(500)

},

error:function(){

$("#loading").hide()

$("#apiResults").show().html(`
<div class="col-12 text-center alert alert-danger">
API Error. Please check your connection or API key.
</div>
`)

}

})

})

// Press ENTER to search
$("#gameQuery").keypress(function(e){
if(e.which==13){
$("#searchBtn").click()
}
})

})
</script>

</body>
</html>
