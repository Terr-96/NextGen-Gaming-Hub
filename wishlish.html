<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | NextGen Gaming Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }

        .hero {
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
                        url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 90px 0;
            clip-path: polygon(0 0, 100% 0, 100% 90%, 0% 100%);
        }

        .wishlist-card {
            border: none;
            border-radius: 20px;
            transition: all 0.3s ease-in-out;
        }

        .wishlist-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15) !important;
        }

        .btn-round {
            border-radius: 50px;
            padding: 10px 22px;
            font-weight: 600;
        }

        .console-badge {
            font-size: 0.95rem;
            padding: 8px 16px;
            border-radius: 50px;
        }

        .empty-box {
            background: white;
            border-radius: 20px;
            padding: 50px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">NextGen Gaming</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="ps5.html">PS5</a>
            <a class="nav-link active" href="wishlist.html">Wishlist</a>
        </div>
    </div>
</nav>

<header class="hero text-center">
    <div class="container">
        <h1 class="display-4 fw-bold">My Wishlist</h1>
        <p class="lead">Save your favourite gaming consoles and manage them anytime.</p>
    </div>
</header>

<main class="container my-5">
    <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
        <h2 class="fw-bold mb-3 mb-md-0">Saved Consoles</h2>
        <div>
            <button class="btn btn-outline-danger btn-round" onclick="clearWishlist()">Clear Wishlist</button>
        </div>
    </div>

    <div id="wishlistContainer" class="row g-4"></div>

    <div id="emptyMessage" class="empty-box text-center d-none">
        <h3 class="fw-bold mb-3">Your wishlist is empty</h3>
        <p class="text-muted mb-4">Start exploring and save your favourite consoles to your wishlist.</p>
        <a href="index.html" class="btn btn-dark btn-round">Back to Home</a>
    </div>
</main>

<div class="modal fade" id="actionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg" style="border-radius: 25px; border: none; overflow: hidden;">
            <div class="modal-header bg-dark text-white border-0">
                <h5 class="modal-title fw-bold">Wishlist Notification</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center p-5">
                <div id="modal-icon" style="font-size: 4rem; margin-bottom: 20px;"></div>
                <h4 id="modal-message" class="fw-bold"></h4>
            </div>
            <div class="modal-footer border-0 justify-content-center pb-4">
                <button type="button" class="btn btn-dark btn-round px-5" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">&copy; 2026 NextGen Gaming Hub | Wishlist Page</p>
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const consoleDetails = {
        PS5: {
            desc: "Experience lightning-fast loading, stunning 4K graphics, and immersive gameplay.",
            color: "primary"
        },
        Xbox: {
            desc: "Enjoy powerful performance and a huge library of games on Xbox Series X.",
            color: "success"
        },
        Switch: {
            desc: "Play anytime, anywhere with Nintendo Switch and its flexible hybrid design.",
            color: "danger"
        }
    };

    function showModal(icon, color, message) {
        const myModal = new bootstrap.Modal(document.getElementById('actionModal'));
        document.getElementById('modal-icon').innerHTML = icon;
        document.getElementById('modal-icon').style.color = color;
        document.getElementById('modal-message').innerHTML = message;
        document.getElementById('modal-message').style.color = color;
        myModal.show();
    }

    function loadWishlist() {
        let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
        let container = document.getElementById('wishlistContainer');
        let emptyMessage = document.getElementById('emptyMessage');

        container.innerHTML = "";

        if (wishlist.length === 0) {
            emptyMessage.classList.remove('d-none');
            return;
        }

        emptyMessage.classList.add('d-none');

        wishlist.forEach(item => {
            let info = consoleDetails[item] || {
                desc: "A great gaming console for your next adventure.",
                color: "secondary"
            };

            let col = document.createElement('div');
            col.className = "col-md-6 col-lg-4";

            col.innerHTML = `
                <div class="card wishlist-card shadow-sm h-100">
                    <div class="card-body d-flex flex-column">
                        <span class="badge bg-${info.color} console-badge align-self-start mb-3">${item}</span>
                        <h4 class="fw-bold">${item}</h4>
                        <p class="text-muted">${info.desc}</p>
                        <div class="mt-auto d-flex gap-2">
                            <button class="btn btn-outline-danger btn-round w-100" onclick="removeItem('${item}')">Remove</button>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(col);
        });
    }

    function removeItem(itemName) {
        let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
        wishlist = wishlist.filter(item => item !== itemName);
        localStorage.setItem('wishlist', JSON.stringify(wishlist));
        loadWishlist();
        showModal("🗑️", "#dc3545", itemName + " has been removed from your wishlist.");
    }

    function clearWishlist() {
        localStorage.removeItem('wishlist');
        loadWishlist();
        showModal("❌", "#dc3545", "Your wishlist has been cleared.");
    }

    $(document).ready(function () {
        loadWishlist();
    });
</script>

</body>
</html>
